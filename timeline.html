*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--char-500);outline-offset:2px;border-radius:3px}

.topbar{position:sticky;top:0;z-index:60;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:26px;padding:0 24px;height:66px}
.brand{width:132px;height:38px;background:var(--logo) left center/contain no-repeat;flex-shrink:0}
.brand-rule{width:1px;height:30px;background:var(--line)}
.nav{display:flex;gap:4px;flex:1}
.nav button{background:transparent;border:0;color:var(--ink-soft);padding:9px 4px;margin:0 10px;font-size:14px;
  border-bottom:2px solid transparent;border-radius:0}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--brand-yellow)}
.wrap{max-width:1180px;margin:0 auto;padding:34px 24px 100px}

.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:var(--r);font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--char-300);background:var(--yellow-050)}
.btn.primary{background:var(--char-700);border-color:var(--char-700);color:#fff}
.btn.primary:hover{background:var(--char-900);border-color:var(--char-900)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-muted)}
.btn.ghost:hover{background:var(--line-soft);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.onDark{background:var(--card);border-color:var(--line);color:var(--ink-soft)}
.btn.onDark:hover{border-color:var(--char-300);color:var(--ink)}

h1{font-family:var(--display);font-size:31px;font-weight:400;margin:0;letter-spacing:-.015em}
h2{font-family:var(--display);font-size:20px;font-weight:400;margin:0;display:flex;align-items:center;gap:11px}
h2::before{content:"";width:4px;height:19px;background:var(--brand-yellow);flex-shrink:0;border-radius:1px}
.modal h2::before,.empty h2::before,.pt h2::before{display:none}
.empty h2{display:block}
.pt h2{display:block}
.eyebrow{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-muted);font-weight:700;margin-bottom:7px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.muted{color:var(--ink-muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* project list */
.plist{display:flex;flex-direction:column;gap:12px}
.prow{padding:19px 22px;display:flex;align-items:center;gap:22px;cursor:pointer;transition:border-color .15s}
.prow:hover{border-color:var(--char-300)}
.prow .nm{font-family:var(--display);font-size:19px;flex:1;min-width:0}
.prow .cl{font-size:13.5px;color:var(--ink-muted);margin-top:3px}
.prow .dt{text-align:right;font-size:13.5px;color:var(--ink-soft);white-space:nowrap}
.prow .dt b{display:block;font-weight:600;color:var(--ink);font-size:14.5px}
.prow .wks{font-family:var(--mono);font-size:22px;color:var(--ink);white-space:nowrap}
.prow .wks span{font-family:var(--body);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-muted);display:block;text-align:right;margin-top:2px}
.empty{padding:80px 26px;text-align:center;border:1px dashed var(--line);border-radius:var(--r-lg);background:var(--card)}
.empty h2{margin:0 0 9px}
.empty p{margin:0 auto 24px;max-width:420px;color:var(--ink-muted)}

/* fields */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-muted);font-weight:700}
.field input,.field select{border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;background:#fff;width:100%}
.field input:focus,.field select:focus{border-color:var(--char-500);outline:none}
.setup{padding:22px 24px;margin-bottom:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}

/* stages */
.stage{padding:18px 20px 16px;border-bottom:1px solid var(--line-soft);display:flex;gap:16px;align-items:flex-start}
.stage:last-child{border-bottom:0}
.stage .x{color:#C7CCC8;padding:4px 8px;margin-top:4px;flex-shrink:0}
.stage .x:hover{color:var(--ink);background:var(--line-soft)}
.stage .grip{cursor:grab;color:#D6D8D0;font-size:17px;padding-top:7px;user-select:none}
.stage .grip:hover{color:var(--ink-muted)}
.stage.dragging{opacity:.3}
.stage.drop{box-shadow:inset 0 2px 0 var(--char-500)}
.stage .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.s-name{border:1px solid transparent;background:transparent;border-radius:var(--r);padding:5px 8px;font-family:var(--display);font-size:17.5px;width:100%}
.s-name:hover{border-color:var(--line)}
.s-name:focus{border-color:var(--char-500);background:#fff;outline:none}
.s-desc{border:1px solid transparent;background:transparent;border-radius:var(--r);padding:5px 8px;font-size:13.5px;color:var(--ink-soft);width:100%}
.s-desc:hover{border-color:var(--line)}
.s-desc:focus{border-color:var(--char-500);background:#fff;outline:none;color:var(--ink)}
.s-desc::placeholder{color:#B9C3C0;font-style:italic}
.s-when{font-size:12.5px;color:var(--char-700);padding-left:8px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.s-when .wk{font-weight:700;letter-spacing:.04em}
.s-when .sep{color:#CDD5D3}
.s-when .fx{color:var(--yellow-600);font-weight:600}
.s-note{font-size:12.5px;padding:6px 10px;border-radius:0 var(--r) var(--r) 0;margin-left:8px;margin-top:2px}
.s-note.warn{color:#7A5A10;background:var(--yellow-100);border-left:2px solid var(--brand-yellow)}
.s-note.info{color:var(--ink-muted);background:#F4F6F4;border-left:2px solid #D6DCD9}
.s-ctl .lnk{padding:2px 6px;font-size:12px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px}
.s-ctl .lnk:hover{color:var(--ink);background:transparent}
.s-ctl{display:flex;flex-direction:column;gap:9px;width:250px;flex-shrink:0}
.s-ctl .line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.s-ctl input[type=number]{border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;width:62px;text-align:right;font-family:var(--mono)}
.s-ctl select{border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:#fff;font-size:13px;flex:1;min-width:0}

/* timeline */
.tl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card)}
.tl{width:max-content;min-width:100%}
.tl-row{display:flex;border-bottom:1px solid var(--line-soft)}
.tl-row:last-of-type{border-bottom:0}
.tl-lab{width:var(--lab);min-width:var(--lab);flex-shrink:0;padding:11px 16px;border-right:1px solid var(--line);background:var(--card);position:sticky;left:0;z-index:4}
.tl-lab .n{font-family:var(--display);font-size:15px;line-height:1.25}
.tl-lab .d{font-size:11.5px;color:var(--ink-muted);margin-top:3px;font-family:var(--mono)}
.tl-track{position:relative;display:flex}
.tl-cell{width:var(--wk);min-width:var(--wk);border-right:1px solid var(--line-soft);flex-shrink:0}
.tl-head{background:var(--yellow-050);border-bottom:1px solid var(--line)}
.tl-head .tl-lab{background:var(--yellow-050);display:flex;align-items:flex-end;}
.tl-head .tl-lab span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);font-weight:700}
.wk-head{width:var(--wk);min-width:var(--wk);flex-shrink:0;padding:9px 4px;text-align:center;border-right:1px solid var(--line-soft)}
.wk-head .w{font-size:12px;font-weight:700;color:var(--ink);font-family:var(--mono)}
.wk-head .d{font-size:10px;color:var(--ink-muted);margin-top:2px;font-family:var(--mono)}
.wk-head .h{font-size:8.5px;color:var(--yellow-600);margin-top:3px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-bar{position:absolute;height:22px;top:11px;border-radius:4px;background:var(--char-500);display:flex;align-items:center;padding:0 10px;color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.tl-bar{border-left:3px solid var(--brand-yellow)}

<body>

<div class="topbar">
  <div class="brand" role="img" aria-label="IUOVA Design Company"></div><div class="brand-rule"></div>
  <nav class="nav" id="nav"></nav>
  <div style="display:flex;gap:8px;align-items:center"><span style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;background:var(--brand-yellow);color:var(--char-900);padding:4px 10px;border-radius:20px">Demo data</span><button class="btn onDark sm" onclick="reloadDemo()">Reload</button><button class="btn onDark sm" onclick="clearDemo()">Clear</button></div>
</div>
<div class="wrap" id="app"></div>
<div id="sheet"></div>
<div id="modalHost"></div>

<script>
/* ============================================================
   IUOVA CLIENT TIMELINE — the simple one.
   Input: a start date and a list of stages with durations.
   Output: a dated week-by-week schedule the client can read.
   ============================================================ */

const KEY='iuova_client_timeline_v1';

/* Storage adapter — swap for Supabase when a shared backend exists.
   create table client_timelines (id text primary key default 'singleton',
     payload jsonb not null, updated_at timestamptz default now()); */
const Store={
  load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; } },
  save(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
};

/* ---------- dates ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY=86400000;
function iso(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function pd(s){if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmt(s){const d=typeof s==='string'?pd(s):s;return d?String(d.getDate()).padStart(2,'0')+'-'+MON[d.getMonth()]+'-'+d.getFullYear():'—'}
function fmtS(s){const d=typeof s==='string'?pd(s):s;return d?String(d.getDate()).padStart(2,'0')+' '+MON[d.getMonth()]:'—'}
function add(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function diff(a,b){return Math.round((pd(iso(b))-pd(iso(a)))/DAY)}
function today(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function uid(){return Math.random().toString(36).slice(2,10)}
function monday(d){return add(d,-((d.getDay()+6)%7))}

/* Working calendar: Sundays off. 2nd and 4th Saturdays off. */
function nthSat(d){return Math.floor((d.getDate()-1)/7)+1}
function weekOff(d){const g=d.getDay();if(g===0)return true;if(g===6){const n=nthSat(d);return n===2||n===4}return false}
function holiday(d){return state.holidays.find(h=>h.date===iso(d))}
function offDay(d){return (state.satRule?weekOff(d):d.getDay()===0) || !!holiday(d)}
function nextWork(d){let x=new Date(d),g=0;while(offDay(x)&&g<400){x=add(x,1);g++}return x}
function plusWork(start,n){/* n working days forward from start, start itself counts as 0 */
  let x=nextWork(start),c=0,g=0;while(c<n&&g<900){x=add(x,1);if(!offDay(x))c++;g++}return x}
function workDays(a,b){const s=pd(a),e=pd(b);if(!s||!e||e<s)return 0;let n=0;for(let d=new Date(s);d<=e;d=add(d,1))if(!offDay(d))n++;return n}

/* ---------- holidays (draft — verify each year) ---------- */
const HOL=[
 ['2026-01-26','Republic Day'],['2026-02-15','Mahashivratri'],['2026-03-04','Dhulivandan (Holi)'],
 ['2026-03-19','Gudi Padwa'],['2026-03-21','Ramzan Id'],['2026-03-26','Ram Navami'],
 ['2026-03-31','Mahavir Jayanti'],['2026-04-03','Good Friday'],['2026-04-14','Dr Ambedkar Jayanti'],
 ['2026-05-01','Maharashtra Day'],['2026-05-28','Bakri Id'],['2026-06-26','Muharram'],
 ['2026-08-15','Independence Day'],['2026-09-14','Ganesh Chaturthi'],['2026-10-02','Gandhi Jayanti'],
 ['2026-10-20','Dussehra'],['2026-11-08','Diwali — Laxmi Pujan'],['2026-11-09','Diwali — Balipratipada'],
 ['2026-11-10','Diwali — Bhaubeej'],['2026-11-24','Guru Nanak Jayanti'],['2026-12-25','Christmas'],
 ['2027-01-26','Republic Day'],['2027-03-06','Mahashivratri'],['2027-03-11','Ramzan Id'],
 ['2027-03-23','Dhulivandan (Holi)'],['2027-03-26','Good Friday'],['2027-04-07','Gudi Padwa'],
 ['2027-04-14','Dr Ambedkar Jayanti'],['2027-04-15','Ram Navami'],['2027-04-19','Mahavir Jayanti'],
 ['2027-05-01','Maharashtra Day'],['2027-05-17','Bakri Id'],['2027-06-15','Muharram'],
 ['2027-08-15','Independence Day'],['2027-09-04','Ganesh Chaturthi'],['2027-10-02','Gandhi Jayanti'],
 ['2027-10-09','Dussehra'],['2027-10-29','Diwali — Laxmi Pujan'],['2027-10-30','Diwali — Balipratipada'],
 ['2027-10-31','Diwali — Bhaubeej'],['2027-11-13','Guru Nanak Jayanti'],['2027-12-25','Christmas']
].map(([date,name])=>({id:uid(),date,name}));

/* ---------- templates ---------- */
const TEMPLATES=[
 {id:'std',name:'Standard — 5 stage',stages:[
  {name:'Research',days:6,desc:'Benchmarking, user study and material scan'},
  {name:'Sketching & Ideation',days:8,desc:'Concept directions explored and narrowed'},
  {name:'3D CAD Modeling',days:12,desc:'Surfacing, detailing and assembly build-up'},
  {name:'Rendering',days:5,desc:'Photoreal visuals in final colours and finishes'},
  {name:'Presentation',days:3,desc:'Design package compiled and walked through'}]},
 {id:'app',name:'Appliance programme — 12 week',stages:[
  {name:'Research & Benchmarking',days:8,desc:'Category teardown, user study and material scan'},
  {name:'Sketching & Ideation',days:10,desc:'Concept directions explored and narrowed'},
  {name:'Client review window',days:3,desc:'Time reserved for your feedback on the shortlist'},
  {name:'3D CAD Modeling',days:15,desc:'Surfacing, detailing and assembly build-up'},
  {name:'DFM with tooling vendor',days:4,desc:'Draft, wall sections and parting lines validated',rule:'with'},
  {name:'Rendering',days:6,desc:'Photoreal visuals in final colours and finishes'},
  {name:'Client Presentation',days:4,desc:'Design package compiled and walked through'}]},
 {id:'sprint',name:'Concept sprint — 4 week',stages:[
  {name:'Research',days:3,desc:'Rapid category and user scan'},
  {name:'Sketching & Ideation',days:6,desc:'Concept directions explored and narrowed'},
  {name:'3D CAD Modeling',days:7,desc:'Form model built to presentation standard'},
  {name:'Rendering',days:3,desc:'Photoreal visuals in final colours and finishes'},
  {name:'Presentation',days:2,desc:'Design package compiled and walked through'}]},
 {id:'blank',name:'Blank — start from scratch',stages:[{name:'Stage one',days:5,desc:''}]}
];

/* ---------- state ---------- */
let state = Store.load() || {
  projects:[], holidays:HOL, satRule:true, templates:[],
  studio:{line1:'IUOVA Design Company',line2:'Filix Tower, Bhandup West, Mumbai'},
  ui:{view:'projects',open:null}
};
if(!state.ui) state.ui={view:'projects',open:null};
if(!state.studio) state.studio={line1:'IUOVA Design Company',line2:'Filix Tower, Bhandup West, Mumbai'};
function save(){ Store.save(state) }

/* ---------- the schedule engine ----------
   Each stage says when it begins relative to the one before it:
     after  — the next working day after the previous stage ends
     with   — the same day the previous stage begins
     into   — N working days after the previous stage begins
   The first stage always begins on the project start date.        */
function schedule(p){
  const out=[]; let prev=null, latest=null;   /* latest = the last end of anything scheduled so far */
  p.stages.forEach((s,i)=>{
    let start;
    if(s.fixedStart) start=nextWork(pd(s.fixedStart));   /* typed by hand — ignores the rule above */
    else if(i===0 || !prev) start=nextWork(pd(p.start));
    else if(s.rule==='with') start=pd(prev.start);
    else if(s.rule==='into') start=plusWork(pd(prev.start), Math.max(0,Number(s.offset)||0));
    else start=nextWork(add(latest,1));       /* waits for every stage above it, not just the one directly above */
    const end=plusWork(start, Math.max(1,Number(s.days)||1)-1);
    out.push({id:s.id,start:iso(start),end:iso(end)});
    prev={start:iso(start),end:iso(end)};
    latest = (!latest || end>latest) ? end : latest;
  });
  return out;
}
function span(p){
  const S=schedule(p);
  if(!S.length){const t=pd(p.start)||today();return{start:t,end:add(t,27),weeks:4}}
  const first=S.reduce((m,r)=>pd(r.start)<m?pd(r.start):m, pd(S[0].start));
  const last =S.reduce((m,r)=>pd(r.end)  >m?pd(r.end)  :m, pd(S[0].end));
  const w0=monday(first);
  return {start:first,end:last,w0,weeks:Math.ceil((diff(w0,last)+1)/7)};
}
/* A hand-dated stage does not move when something above it grows. An overlap you
   chose is just information; an overlap that appeared later is worth flagging. */
function latestAbove(S,i){
  let e=null; for(let j=0;j<i;j++){const x=pd(S[j].end); if(!e||x>e)e=x} return e;
}
function notices(p){
  const S=schedule(p), out={};
  p.stages.forEach((st,i)=>{
    if(!st.fixedStart) return;
    const msgs=[];
    if(iso(nextWork(pd(st.fixedStart)))!==st.fixedStart)
      msgs.push({t:'warn',m:`${fmt(st.fixedStart)} is not a working day — this stage begins ${fmt(S[i].start)}.`});

    const now=latestAbove(S,i);
    if(now && pd(S[i].start)<=now){
      let block=null;
      for(let j=0;j<i;j++) if(pd(S[j].end)>=pd(S[i].start))
        if(block===null||pd(S[j].end)>pd(S[block].end)) block=j;
      const drifted = st.fixedRef && pd(st.fixedRef) < now;
      if(pd(S[i].start) < pd(S[block].start))
        msgs.push({t:'warn',m:`This now runs before ${p.stages[block].name} even begins on ${fmt(S[block].start)}.`});
      else if(drifted)
        msgs.push({t:'warn',m:`${p.stages[block].name} has grown since this date was set — it now finishes ${fmt(S[block].end)}.`});
      else
        msgs.push({t:'info',m:`Runs alongside ${p.stages[block].name}, which finishes ${fmt(S[block].end)}.`});
    }
    if(msgs.length) out[st.id]=msgs;
  });
  return out;
}
function weekOf(p,dateStr){ const s=span(p); return Math.floor(diff(s.w0,pd(dateStr))/7)+1 }
function weekLabel(p,r){
  const a=weekOf(p,r.start), b=weekOf(p,r.end);
  return a===b ? 'Week '+a : 'Week '+a+' – '+b;
}

/* ---------- model ---------- */
function newStage(n,d,desc){ return {id:uid(),name:n||'New stage',days:d||5,desc:desc||'',rule:'after',offset:2} }
function newProject(tplId){
  const t=[...TEMPLATES,...state.templates].find(x=>x.id===tplId)||TEMPLATES[0];
  return {id:uid(),name:'Untitled project',client:'',code:'',manager:'',version:'R0',
    start:iso(nextWork(today())),issued:iso(today()),
    stages:t.stages.map(s=>{const st=newStage(s.name,s.days,s.desc); if(s.rule)st.rule=s.rule; return st})};
}

/* ---------- render ---------- */
function render(){
  document.getElementById('nav').innerHTML=[['projects','Timelines'],['settings','Settings']]
    .map(([k,l])=>`<button class="${state.ui.view===k&&!state.ui.open?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  const app=document.getElementById('app');
  if(state.ui.open){
    const p=state.projects.find(x=>x.id===state.ui.open);
    if(!p){state.ui.open=null;return render()}
    app.innerHTML=vProject(p); wire(p); return;
  }
  app.innerHTML = state.ui.view==='settings' ? vSettings() : vProjects();
}
function go(v){state.ui.view=v;state.ui.open=null;save();render();scrollTo(0,0)}
function open_(id){state.ui.open=id;save();render();scrollTo(0,0)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ---------- project list ---------- */
function vProjects(){
  if(!state.projects.length) return `
    <div class="head"><div><div class="eyebrow">Client schedules</div><h1>Project timelines</h1></div></div>
    <div class="empty"><h2>Nothing scheduled yet</h2>
      <p>Set a start date, list the stages and how long each one takes. The dates work themselves out.</p>
      <button class="btn primary" onclick="startNew()">Create a timeline</button></div>`;
  const rows=state.projects.map(p=>{
    const s=span(p);
    return `<div class="card prow" onclick="open_('${p.id}')">
      <div class="nm">${esc(p.name)}<div class="cl">${esc(p.client||'Client not set')}${p.code?' · '+esc(p.code):''}</div></div>
      <div class="dt"><b>${fmt(iso(s.start))}</b>to ${fmt(iso(s.end))}</div>
      <div class="wks">${s.weeks}<span>weeks</span></div></div>`;
  }).join('');
  return `<div class="head"><div><div class="eyebrow">Client schedules</div><h1>Project timelines</h1></div>
    <button class="btn primary" onclick="startNew()">New timeline</button></div>
    <div class="plist">${rows}</div>`;
}
function startNew(){
  const all=[...TEMPLATES,...state.templates];
  modal('Start a timeline',
    `<div class="field"><label>Begin from</label><select id="tpl">${all.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
     <div class="muted" style="font-size:13.5px">Stage names, durations and descriptions come across ready to edit.</div>`,
    [{label:'Create',cls:'btn primary',act:()=>{
      const p=newProject(document.getElementById('tpl').value);
      state.projects.unshift(p);save();open_(p.id);}}]);
}

/* ---------- project view ---------- */
const RULES=[['after','After the stages above it'],['with','Alongside the stage above'],['into','Overlapping the stage above']];

function vProject(p){
  const S=schedule(p), s=span(p), map={};
  S.forEach(r=>map[r.id]=r);

  const N=notices(p);
  const stages=p.stages.map((st,i)=>{
    const r=map[st.id];
    const note=(N[st.id]||[]).map(x=>`<div class="s-note ${x.t}">${esc(x.m)}</div>`).join('');
    return `<div class="stage" draggable="true" data-id="${st.id}">
      <span class="grip">⣿</span>
      <div class="main">
        <input class="s-name" value="${esc(st.name)}" oninput="setS('${st.id}','name',this.value)" placeholder="Stage name">
        <input class="s-desc" value="${esc(st.desc)}" oninput="setS('${st.id}','desc',this.value)" placeholder="What happens in this stage — one line the client will read">
        <div class="s-when"><span class="wk">${weekLabel(p,r)}</span><span class="sep">·</span>
          <span class="mono">${fmt(r.start)} → ${fmt(r.end)}</span>${st.fixedStart?'<span class="sep">·</span><span class="fx">date set by hand</span>':''}</div>
        ${note}
      </div>
      <div class="s-ctl">
        <div class="line"><input type="number" min="1" value="${st.days}" onchange="setS('${st.id}','days',Math.max(1,Number(this.value)||1))"> working days</div>
        ${st.fixedStart
          ? `<div class="line"><input type="date" value="${st.fixedStart}" onchange="setFixed('${st.id}',this.value)" style="flex:1"></div>
             <div class="line" style="justify-content:flex-end"><button class="btn ghost sm lnk" onclick="setFixed('${st.id}',null)">Back to automatic</button></div>`
          : `${i===0?'<div class="line muted" style="font-size:12.5px">Begins on the project start date</div>':`
             <div class="line"><select onchange="setS('${st.id}','rule',this.value)">
               ${RULES.map(([v,l])=>`<option value="${v}" ${st.rule===v?'selected':''}>${l}</option>`).join('')}</select></div>
             ${st.rule==='into'?`<div class="line"><input type="number" min="0" value="${st.offset}" onchange="setS('${st.id}','offset',Math.max(0,Number(this.value)||0))"> days in</div>`:''}`}
             <div class="line" style="justify-content:flex-end"><button class="btn ghost sm lnk" onclick="setFixed('${st.id}','${r.start}')">Pick a start date</button></div>`}
      </div>
      <button class="btn ghost sm x" onclick="delS('${st.id}')" title="Remove this stage" aria-label="Remove ${esc(st.name)}">✕</button>
      </div>`;
  }).join('');

  return `
  <div class="head">
    <div><div class="eyebrow"><a href="#" onclick="go('projects');return false" style="color:inherit;text-decoration:none">← All timelines</a></div>
      <h1>${esc(p.name)}</h1>
      <div class="muted" style="margin-top:8px;font-size:14px">${s.weeks} weeks · ${fmt(iso(s.start))} to ${fmt(iso(s.end))}</div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn primary" onclick="makePDF('${p.id}')">Download PDF</button>
      <button class="btn" onclick="mailIt('${p.id}')">Email draft</button>
      <button class="btn ghost" onclick="delP('${p.id}')">Delete</button>
    </div>
  </div>

  <div class="card setup">
    <div class="field"><label>Project</label><input value="${esc(p.name)}" oninput="setP('name',this.value)"></div>

  </div>

  <div class="sec"><div class="sec-head"><h2>Timeline</h2></div>${chart(p)}</div>`;
}

/* ---------- week chart ---------- */
function chart(p){
  const S=schedule(p), s=span(p), map={}; S.forEach(r=>map[r.id]=r);
  const W=66, n=Math.max(s.weeks,1), total=n*W;
  const pos=d=>diff(s.w0,pd(d))/7*W;

  const head=Array.from({length:n},(_,i)=>{
    const m0=add(s.w0,i*7);
    let hol='';
    for(let k=0;k<7;k++){const h=holiday(add(m0,k)); if(h){hol=h.name.split('—')[0].trim();break}}
    return `<div class="wk-head"><div class="w">W${i+1}</div><div class="d">${fmtS(iso(m0))}</div>${hol?`<div class="h" title="${esc(hol)}">${esc(hol)}</div>`:'<div class="h">&nbsp;</div>'}</div>`;
  }).join('');
  const cells=Array.from({length:n},()=>`<div class="tl-cell"></div>`).join('');

  const rows=p.stages.map(st=>{
    const r=map[st.id]; const x=pos(r.start), w=Math.max(pos(r.end)+W/7-x,26);
    return `<div class="tl-row">
      <div class="tl-lab"><div class="n">${esc(st.name)}</div><div class="d">${fmtS(r.start)} → ${fmtS(r.end)} · ${st.days} wd</div></div>
      <div class="tl-track" style="width:${total}px;min-width:${total}px;height:44px">${cells}
        <div class="tl-bar" style="left:${x}px;width:${w}px" title="${fmt(r.start)} → ${fmt(r.end)}">${w>92?weekLabel(p,r):''}</div>
      </div></div>`;
  }).join('');

  return `<div class="tl-wrap"><div class="tl">
    <div class="tl-row tl-head"><div class="tl-lab"><span>Stage</span></div>
      <div class="tl-track" style="width:${total}px;min-width:${total}px">${head}</div></div>
    ${rows||'<div class="tl-row"><div style="padding:26px" class="muted">Add a stage to draw the timeline.</div></div>'}
    <div class="tl-foot">Each column is one week, dated from its Monday. Durations count working days only — Sundays, the 2nd and 4th Saturday, and public holidays are already excluded.</div>
  </div></div>`;
}

function cur(){return state.projects.find(x=>x.id===state.ui.open)}
function setP(k,v){cur()[k]=v;save();if(k==='name')render()}
function setStart(v){
  const p=cur(); p.start=v; save();
  if(v&&offDay(pd(v))){const h=holiday(pd(v));toast(`${fmt(v)} is ${h?h.name:'a non-working day'} — the first stage begins the next working day.`)}
  render();
}
function setS(id,k,v){const st=cur().stages.find(x=>x.id===id);st[k]=v;save();render()}
function setFixed(id,v){
  const p=cur(), st=p.stages.find(x=>x.id===id);
  st.fixedStart = v || null;
  if(v){ const S=schedule(p), i=p.stages.findIndex(x=>x.id===id), e=latestAbove(S,i);
         st.fixedRef = e?iso(e):null; }
  else delete st.fixedRef;
  save();
  if(v && offDay(pd(v))){const h=holiday(pd(v));toast(`${fmt(v)} is ${h?h.name:'a non-working day'} — the stage begins on the next working day.`)}
  if(!v) toast('Back to automatic — this stage follows the stage above again.');
  render();
}
function addS(){cur().stages.push(newStage());save();render()}
function delS(id){const p=cur();confirmBox('Remove stage','It comes off the schedule and the stages after it move up.',()=>{p.stages=p.stages.filter(s=>s.id!==id);save();render()})}
function delP(id){confirmBox('Delete timeline','This timeline is removed from this browser. Export from Settings first if you need a copy.',()=>{state.projects=state.projects.filter(p=>p.id!==id);state.ui.open=null;save();render()})}
function wire(p){
  const host=document.getElementById('stageList'); if(!host) return;
  let from=null;
  host.querySelectorAll('.stage[data-id]').forEach(el=>{
    el.addEventListener('dragstart',e=>{from=el.dataset.id;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');host.querySelectorAll('.stage').forEach(x=>x.classList.remove('drop'))});
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drop')});
    el.addEventListener('dragleave',()=>el.classList.remove('drop'));
    el.addEventListener('drop',e=>{e.preventDefault();
      const a=p.stages.findIndex(s=>s.id===from), b=p.stages.findIndex(s=>s.id===el.dataset.id);
      if(a<0||b<0||a===b)return; const[x]=p.stages.splice(a,1); p.stages.splice(b,0,x); save(); render();});
  });
}
function saveTpl(pid){

    [{label:'Save',cls:'btn primary',act:()=>{const n=document.getElementById('tn').value.trim();

/* ---------- PDF ---------- */
function makePDF(pid){
  const p=state.projects.find(x=>x.id===pid), S=schedule(p), s=span(p), map={}; S.forEach(r=>map[r.id]=r);
  const usable = s.weeks*66 + 270;
  const paper = usable>1047 ? 'A3' : 'A4';
  const cap   = paper==='A3' ? 1512 : 1047;
  const scale = Math.min(1, cap/usable);

  let st=document.getElementById('pgStyle');
  if(!st){st=document.createElement('style');st.id='pgStyle';document.head.appendChild(st)}
  st.textContent=`@media print{@page{size:${paper} landscape;margin:11mm}}`;

  const rows=p.stages.map(x=>{const r=map[x.id];
    return `<tr><td><strong>${esc(x.name)}</strong>${x.desc?`<span class="sd">${esc(x.desc)}</span>`:''}</td>
      <td>${weekLabel(p,r)}</td><td>${fmt(r.start)}</td><td>${fmt(r.end)}</td><td>${x.days} working days</td></tr>`}).join('');

  document.getElementById('sheet').innerHTML=`<div>
    <div class="ph"><div class="pw" role="img" aria-label="IUOVA Design Company"></div>

      <div><span>Completes</span>${fmt(iso(s.end))}</div>
      <div><span>Duration</span>${s.weeks} weeks</div>
    </div>
    <div style="zoom:${scale};margin-bottom:10px">${chart(p)}</div>
    <table class="pt-b"><thead><tr><th style="width:38%">Stage</th><th style="width:13%">Weeks</th>
      <th style="width:15%">Starts</th><th style="width:15%">Completes</th><th>Duration</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="pf">
      <div>Working calendar: Sundays${state.satRule?', the 2nd and 4th Saturday of each month,':''} and declared public holidays are non-working and already excluded from every duration. Dates assume feedback and approvals reach us within the agreed review windows.</div>
